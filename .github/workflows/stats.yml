name: Profile stats

on:
  schedule:
    # Mondays 05:00 UTC
    - cron: "0 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "profile.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

# Pull request dry runs get their own group so they never replace a pending
# write run on main.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('profile-stats-pr-{0}', github.event.pull_request.number) || 'profile-stats' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes exact release tags only, no floating major tag.
      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest

      # Only runs on main write README.md; anything else prints the block and
      # the report as a dry run.
      - name: Generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run python scripts/profile_stats.py
          ${{ github.ref != 'refs/heads/main' && '--dry-run' || '' }}

      - name: Commit
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README.md unchanged."
            exit 0
          fi
          git commit -m "chore(profile): update generated project stats"
          git pull --rebase
          git push
